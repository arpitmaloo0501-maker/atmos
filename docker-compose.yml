version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: atmos_redis
    ports:
      - "6379:6379"
    restart: always

  ai_engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: atmos_ai_engine
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  collector:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: atmos_collector
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - redis
      - ai_engine
    restart: always
