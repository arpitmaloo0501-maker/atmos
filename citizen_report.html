<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Weather Reporter | Atmos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px; 
            margin: 0;
            box-sizing: border-box;
        }
        .header-nav {
            width: 100%;
            max-width: 480px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .card { 
            background: #1e293b; 
            padding: 28px; 
            border-radius: 12px; 
            max-width: 480px; 
            width: 100%; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 20px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 6px; }
        input, select, textarea, button { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button.action-btn { 
            background: #0284c7; 
            color: white; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 18px; 
            transition: background 0.15s;
        }
        button.action-btn:hover { background: #0369a1; }
        button.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .gps-badge { display: inline-block; font-size: 12px; color: #4ade80; margin-top: 6px; }
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }
        .result-box.verified {
            display: block;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }
        .result-box.suspicious {
            display: block;
            background: rgba(245, 158, 11, 0.18);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fde68a;
        }
        .result-box.rejected {
            display: block;
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
    </style>
</head>
<body>
<div class="header-nav">
    <a href="./index.html#citizen" class="back-link">← Return to Atmos Dashboard</a>
    <span style="font-size: 12px; color: #94a3b8; font-weight: 600;">PORTAL V2.0</span>
</div>

<div class="card">
    <h2>📡 Submit Ground Observation</h2>
    <p style="font-size: 13px; color: #94a3b8;">Reports are automatically cross-checked by the Atmos AI Engine against local Doppler and meteorological sensors.</p>
    
    <form id="citizenForm">
        <label>Observation Details</label>
        <textarea id="text" rows="3" placeholder="Describe the weather condition (e.g. Flooding near Dadar station #IMD)..." required></textarea>

        <label>Reported Event Category</label>
        <select id="category">
            <option value="Rainfall">Rainfall</option>
            <option value="Flooding">Flooding</option>
            <option value="Thunderstorm">Thunderstorm</option>
            <option value="Heatwave">Heatwave</option>
            <option value="Fog">Fog</option>
            <option value="Dust Storm">Dust Storm</option>
            <option value="Strong Winds">Strong Winds</option>
        </select>

        <label>Photo/Video Media URL</label>
        <input type="url" id="mediaUrl" placeholder="https://example.com/photo.jpg (Optional)">

        <label>Location Coordinates</label>
        <button type="button" onclick="acquireGPS()" style="background: #334155; cursor: pointer;">📍 Tag Current Device GPS</button>
        <span id="gpsStatus" class="gps-badge">No GPS tagged (City NER will be used)</span>

        <button type="submit" id="submitBtn" class="action-btn">Submit to Central Pipeline</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    let userLat = null;
    let userLon = null;

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }

    function acquireGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('gpsStatus').innerText = `✓ Verified GPS: ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
                },
                () => { alert("Location access denied. Named-Entity geocoding will be applied from text."); }
            );
        }
    }

    async function syncOfflineQueue() {
        const queue = JSON.parse(localStorage.getItem('atmos_offline_reports') || '[]');
        if (!queue.length) return;
        
        console.log(`[PWA] Online again. Syncing ${queue.length} cached offline reports...`);
        const remaining = [];
        
        for (const item of queue) {
            try {
                await fetch('http://localhost:8000/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
            } catch (e) {
                remaining.push(item);
            }
        }
        localStorage.setItem('atmos_offline_reports', JSON.stringify(remaining));
        if (remaining.length === 0) alert("All offline reports synchronized successfully!");
    }

    window.addEventListener('online', syncOfflineQueue);

    document.getElementById('citizenForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            id: `citizen_${Date.now()}`,
            text: document.getElementById('text').value,
            media_url: document.getElementById('mediaUrl').value || null,
            lat: userLat,
            lon: userLon
        };

        if (!navigator.onLine) {
            const queue = JSON.parse(localStorage.getItem('atmos_offline_reports') || '[]');
            queue.push(payload);
            localStorage.setItem('atmos_offline_reports', JSON.stringify(queue));
            alert("⚠️ Network offline. Your report is securely queued and will automatically sync when connection returns.");
            document.getElementById('citizenForm').reset();
            return;
        }

        try {
            const resp = await fetch('http://localhost:8000/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await resp.json();
            alert(`Report Accepted!\nStatus: ${result.verification_status}\nSeverity: ${result.category}`);
            document.getElementById('citizenForm').reset();
        } catch (err) {
            alert("Server not responding. Saving report to local offline storage.");
            const queue = JSON.parse(localStorage.getItem('atmos_offline_reports') || '[]');
            queue.push(payload);
            localStorage.setItem('atmos_offline_reports', JSON.stringify(queue));
        }
    });
</script>
</body>
</html>
