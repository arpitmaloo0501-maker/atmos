<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos Citizen Reporter</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #0f172a; color: white; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; margin: 0 auto 20px auto; max-width: 500px; box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
        input, select, textarea, button { width: 100%; margin-top: 15px; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #0ea5e9; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background: #0284c7; }
        
        #statusBox { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; display: none; text-align: center; }
        .offline-warning { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
        .online-success { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
        
        /* Reports Section Styles */
        .report-item { background: #334155; padding: 12px; margin-top: 10px; border-radius: 6px; border-left: 4px solid #0ea5e9; }
        .report-item.offline { border-left-color: #f59e0b; }
        .report-item.verified { border-left-color: #22c55e; }
        .report-item.rejected { border-left-color: #ef4444; }
    </style>
</head>
<body>

    <!-- Reporting Form -->
    <div class="card">
        <h2 style="margin-top: 0; color: #38bdf8;">🚨 Submit Weather Report</h2>
        <form id="citizenForm">
            <select id="category" required>
                <option value="Rainfall">Heavy Rainfall</option>
                <option value="Flooding">Flooding</option>
                <option value="Cyclone">Cyclone / High Winds</option>
                <option value="Heatwave">Severe Heatwave</option>
            </select>
            <textarea id="text" rows="4" placeholder="Describe the situation..." required></textarea>
            
            <button type="button" onclick="acquireGPS()" style="background: #475569;">📍 Attach My GPS Coordinates</button>
            <p id="gpsStatus" style="font-size: 14px; color: #94a3b8; text-align: center; margin-top: 8px;">GPS: Not acquired yet</p>
            
            <button type="submit">Submit Emergency Report</button>
        </form>
        <div id="statusBox"></div>
    </div>

    <!-- Offline-Ready Reports Section -->
    <div class="card">
        <h3 style="margin-top: 0; color: #f8fafc;">📋 My Recent Reports</h3>
        <div id="reportsList">
            <p style="color: #94a3b8; font-size: 14px;">No reports submitted yet.</p>
        </div>
    </div>

    <script>
        let userLat = null; let userLon = null;
        const statusBox = document.getElementById('statusBox');

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.error);

        // --- GPS Logic ---
        function acquireGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                        document.getElementById('gpsStatus').innerText = `✓ GPS Locked: ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
                    },
                    () => { document.getElementById('gpsStatus').innerText = "❌ Location denied."; }
                );
            }
        }

        // --- UI & Storage Logic ---
        function showNotification(msg, type) {
            statusBox.style.display = 'block';
            statusBox.className = type === 'error' ? 'offline-warning' : 'online-success';
            statusBox.innerText = msg;
        }

        function saveAndRenderReport(payload, syncStatus, trustScore = null) {
            // Organize reports as an array of structured objects in local storage
            const history = JSON.parse(localStorage.getItem('atmos_display_history') || '[]');
            payload.syncStatus = syncStatus;
            payload.trustScore = trustScore;
            history.push(payload);
            localStorage.setItem('atmos_display_history', JSON.stringify(history));
            renderReports();
        }

        function renderReports() {
            const history = JSON.parse(localStorage.getItem('atmos_display_history') || '[]');
            const list = document.getElementById('reportsList');
            
            if (history.length === 0) return;

            list.innerHTML = history.reverse().map(r => `
                <div class="report-item ${r.syncStatus === 'offline' ? 'offline' : (r.trustScore >= 80 ? 'verified' : 'rejected')}">
                    <strong>${r.category}</strong>
                    <p style="margin: 5px 0; font-size: 14px;">${r.text}</p>
                    <small style="color: #cbd5e1;">
                        ${r.syncStatus === 'offline' ? '⏳ Queued (Offline)' : `✅ Synced (Trust Score: ${r.trustScore}%)`}
                    </small>
                </div>
            `).join('');
        }

        // Render on page load
        renderReports();

        // --- Network Sync Logic ---
        async function syncOfflineQueue() {
            const queue = JSON.parse(localStorage.getItem('atmos_offline_queue') || '[]');
            if (queue.length === 0) return;
            
            showNotification(`🔄 Reconnected! Syncing ${queue.length} offline reports...`, "success");
            const remaining = [];
            
            for (const item of queue) {
                try {
                    let score = 50;
                    try {
                        const resp = await fetch('http://localhost:8000/verify', { 
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item)
                        });
                        if (resp.ok) {
                            const data = await resp.json();
                            score = data.trust_score;
                        }
                    } catch(e) {}

                    // Forward to server ingest & database
                    const ingestResp = await fetch('/ingest', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            event_type: item.category,
                            text: item.text,
                            lat: item.lat,
                            lon: item.lon
                        })
                    });
                    if (ingestResp.ok) {
                        const ingData = await ingestResp.json();
                        if (typeof ingData.trust_score === 'number') score = ingData.trust_score;
                    }
                    
                    // Update display history to show it is now synced
                    let history = JSON.parse(localStorage.getItem('atmos_display_history') || '[]');
                    let reportToUpdate = history.find(r => r.id === item.id);
                    if(reportToUpdate) {
                        reportToUpdate.syncStatus = 'online';
                        reportToUpdate.trustScore = score;
                    }
                    localStorage.setItem('atmos_display_history', JSON.stringify(history));
                    renderReports();

                } catch (e) {
                    remaining.push(item);
                }
            }
            
            localStorage.setItem('atmos_offline_queue', JSON.stringify(remaining));
            if (remaining.length === 0) setTimeout(() => showNotification("✅ Offline reports synced & AI verified!", "success"), 2000);
        }

        window.addEventListener('online', syncOfflineQueue);

        // --- Submit Handler ---
        document.getElementById('citizenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                id: `citizen_${Date.now()}`,
                category: document.getElementById('category').value,
                text: document.getElementById('text').value,
                lat: userLat,
                lon: userLon
            };

            if (!navigator.onLine) {
                // Save to queue for background sync
                const queue = JSON.parse(localStorage.getItem('atmos_offline_queue') || '[]');
                queue.push(payload);
                localStorage.setItem('atmos_offline_queue', JSON.stringify(queue));
                
                // Save to display history as offline
                saveAndRenderReport(payload, 'offline');
                showNotification("⚠️ NETWORK OFFLINE: Report queued locally.", "error");
                document.getElementById('citizenForm').reset();
                return;
            }

            try {
                let score = 50;
                let status = "Suspicious";

                // 1. Check Python AI engine if available
                try {
                    const resp = await fetch('http://localhost:8000/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        score = data.trust_score;
                        status = data.verification_status;
                    }
                } catch (err) {}

                // 2. Ingest into Node server & cross-check live Weather API
                const ingestResp = await fetch('/ingest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_type: payload.category,
                        text: payload.text,
                        lat: payload.lat,
                        lon: payload.lon
                    })
                });

                if (ingestResp.ok) {
                    const ingData = await ingestResp.json();
                    if (typeof ingData.trust_score === 'number') {
                        score = ingData.trust_score;
                        status = ingData.status;
                    }
                }
                
                saveAndRenderReport(payload, 'online', score);
                const emoji = score >= 80 ? "✅" : score >= 40 ? "⚠️" : "🛑";
                showNotification(`${emoji} AI Analyzed! Real Trust Score: ${score}% [${status}]`, score >= 80 ? "success" : "error");
                document.getElementById('citizenForm').reset();
                
            } catch (err) {
                const queue = JSON.parse(localStorage.getItem('atmos_offline_queue') || '[]');
                queue.push(payload);
                localStorage.setItem('atmos_offline_queue', JSON.stringify(queue));
                saveAndRenderReport(payload, 'offline');
                showNotification("⚠️ SERVER DOWN: Report queued locally.", "error");
            }
        });
    </script>
</body>
</html>
