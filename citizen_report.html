<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Weather Reporter | Atmos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px; 
            margin: 0;
            box-sizing: border-box;
        }
        .header-nav {
            width: 100%;
            max-width: 480px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .card { 
            background: #1e293b; 
            padding: 28px; 
            border-radius: 12px; 
            max-width: 480px; 
            width: 100%; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 20px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 6px; }
        input, select, textarea, button { 
            width: 100%; 
            box-sizing: border-box; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button.action-btn { 
            background: #0284c7; 
            color: white; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 18px; 
            transition: background 0.15s;
        }
        button.action-btn:hover { background: #0369a1; }
        button.action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .gps-badge { display: inline-block; font-size: 12px; color: #4ade80; margin-top: 6px; }
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
        }
        .result-box.verified {
            display: block;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }
        .result-box.suspicious {
            display: block;
            background: rgba(245, 158, 11, 0.18);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fde68a;
        }
        .result-box.rejected {
            display: block;
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
    </style>
</head>
<body>
<div class="header-nav">
    <a href="./index.html#citizen" class="back-link">← Return to Atmos Dashboard</a>
    <span style="font-size: 12px; color: #94a3b8; font-weight: 600;">PORTAL V2.0</span>
</div>

<div class="card">
    <h2>📡 Submit Ground Observation</h2>
    <p style="font-size: 13px; color: #94a3b8;">Reports are automatically cross-checked by the Atmos AI Engine against local Doppler and meteorological sensors.</p>
    
    <form id="citizenForm">
        <label>Observation Details</label>
        <textarea id="text" rows="3" placeholder="Describe the weather condition (e.g. Flooding near Dadar station #IMD)..." required></textarea>

        <label>Reported Event Category</label>
        <select id="category">
            <option value="Rainfall">Rainfall</option>
            <option value="Flooding">Flooding</option>
            <option value="Thunderstorm">Thunderstorm</option>
            <option value="Heatwave">Heatwave</option>
            <option value="Fog">Fog</option>
            <option value="Dust Storm">Dust Storm</option>
            <option value="Strong Winds">Strong Winds</option>
        </select>

        <label>Photo/Video Media URL</label>
        <input type="url" id="mediaUrl" placeholder="https://example.com/photo.jpg (Optional)">

        <label>Location Coordinates</label>
        <button type="button" onclick="acquireGPS()" style="background: #334155; cursor: pointer;">📍 Tag Current Device GPS</button>
        <span id="gpsStatus" class="gps-badge">No GPS tagged (City NER will be used)</span>

        <button type="submit" id="submitBtn" class="action-btn">Submit to Central Pipeline</button>
    </form>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    // Supabase configuration for real-time central storage
    const SUPABASE_URL = 'https://rblcrsboalpuhofaeqol.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJibGNyc2JvYWxwdWhvZmFlcW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODM3NTQsImV4cCI6MjEwNDI1OTc1NH0.dKh0sPbzAlKpPxP0KSVb3YSSVYhbEdPTA5gufHxmHqM';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let userLat = null;
    let userLon = null;

    function acquireGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('gpsStatus').innerText = `✓ Verified GPS: ${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
                },
                (err) => { alert("Location access denied. Named-Entity geocoding will be applied from report text."); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    }

    document.getElementById('citizenForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const textVal = document.getElementById('text').value.trim();
        const categoryVal = document.getElementById('category').value;
        const mediaVal = document.getElementById('mediaUrl').value || null;

        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ Verifying with AI & Sensors...";
        resultBox.style.display = "none";

        const payload = {
            id: `citizen_${Date.now()}`,
            text: textVal,
            media_url: mediaVal,
            category: categoryVal,
            lat: userLat,
            lon: userLon
        };

        try {
            const resp = await fetch('http://localhost:8000/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await resp.json();

            // Check if rejected
            if (result.status && result.status.startsWith("REJECTED")) {
                resultBox.className = "result-box rejected";
                resultBox.innerHTML = `<strong>❌ Report Dropped:</strong> ${result.reason || "Duplicate submission detected."}`;
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit to Central Pipeline";
                return;
            }

            // Central Database Logging
            if (supabaseClient) {
                try {
                    const primaryPayload = {
                        source_type: "citizen_app",
                        original_text: textVal,
                        media_url: mediaVal,
                        category: result.category || categoryVal,
                        city: result.city || "Citizen Telemetry",
                        state: result.state || "India",
                        latitude: result.latitude || userLat || 21.2514,
                        longitude: result.longitude || userLon || 81.6296,
                        verification_status: result.verification_status,
                        credibility_score: result.credibility_score,
                        event_type: result.category || categoryVal,
                        description: textVal,
                        status: result.verification_status,
                        trust_score: Math.round(result.credibility_score * 100),
                        created_at: new Date().toISOString()
                    };

                    let { error } = await supabaseClient.from('weather_reports').insert([primaryPayload]);
                    if (error && (error.code === 'PGRST204' || error.message?.includes('column'))) {
                        await supabaseClient.from('weather_reports').insert([{
                            city: result.city || "Citizen Telemetry",
                            state: result.state || "India",
                            event_type: result.category || categoryVal,
                            description: textVal,
                            latitude: result.latitude || userLat || 21.2514,
                            longitude: result.longitude || userLon || 81.6296,
                            status: result.verification_status,
                            trust_score: Math.round(result.credibility_score * 100),
                            media_url: mediaVal || "",
                            created_at: new Date().toISOString()
                        }]);
                    }
                } catch (dbErr) {
                    console.warn("DB insert notice:", dbErr);
                }
            }

            const isVerified = result.verification_status === "VERIFIED";
            resultBox.className = isVerified ? "result-box verified" : "result-box suspicious";
            resultBox.innerHTML = `
                <strong>${isVerified ? "✓ Report Verified" : "⚠️ Suspicious / Unverified"}</strong><br/>
                Category: <strong>${result.category}</strong> | Location: <strong>${result.city || 'NER Resolved'}</strong><br/>
                Credibility Score: <strong>${Math.round(result.credibility_score * 100)}%</strong>
            `;

            alert(`Report Status: ${result.verification_status}\nCategory: ${result.category}\nCity: ${result.city}\nCredibility: ${result.credibility_score}`);
            document.getElementById('citizenForm').reset();
            document.getElementById('gpsStatus').innerText = "No GPS tagged (City NER will be used)";
            userLat = null;
            userLon = null;
        } catch (err) {
            alert("Ensure ai_engine.py is running on port 8000.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit to Central Pipeline";
        }
    });
</script>
</body>
</html>
